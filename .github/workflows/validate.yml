name: validate

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # validate はネットワーク不要なので telemetry などの外向き通信を止める
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.283
      - run: claude plugin validate --strict .
      - run: ./scripts/validate-plugins.sh

  # onboard 済み workflow の lockfile はランナーが実行時に検証する。この job は
  # それより手前のずれ (lockfile に無い uses、使われていない記録) を見る。
  actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: usadamasa/gh-manage/actions/verify-actions-lock@main

  # plugin に同梱した Go の CLI (github-ops の repo-scan、visuals の cleanshot-capture) とビルドの script のテスト
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - github-ops
          - visuals
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - run: go -C "plugins/${{ matrix.plugin }}" vet ./...
      - run: go -C "plugins/${{ matrix.plugin }}" test ./...

  # visuals の show-image.sh は rex の block で macOS の /bin/bash (3.2) が動かす。
  # bash 4 以降の機能の混入を拾えるよう、macOS の runner で回す
  bats-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # bats 本体は PATH の bash で動く。/bin/bash (3.2) のままだと日本語のテスト名を解決できないので、
      # Homebrew の bash を入れる。show-image.sh はテストの中で /bin/bash を明示して動かす
      - run: brew install bash bats-core
      - run: bats plugins/visuals/tests

  # Branch Ruleset の required status check にはこのジョブだけを登録する
  ci-status-check:
    needs:
      - actions-lock
      - bats-test
      - go-test
      - validate
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
