name: validate

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # go-test と bats-test の対象の plugin を、変わったパスから決める。
  # plugin を CI に載せるには plugins/<name>/go.mod か plugins/<name>/tests/ を置く (この workflow の変更は要らない)
  changes:
    runs-on: ubuntu-slim
    outputs:
      go-plugins: ${{ steps.targets.outputs.go-plugins }}
      bats-plugins: ${{ steps.targets.outputs.bats-plugins }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml
          list-files: json
      - id: targets
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          PLUGIN_FILES: ${{ steps.filter.outputs.plugins_files }}
        run: |
          set -euo pipefail
          # 引数のパス (plugins/<name>/...) から plugin 名を取り出し、JSON の配列で返す
          plugin_names() {
            local path
            for path in "$@"; do
              [ -e "$path" ] || continue
              path=${path#plugins/}
              printf '%s\n' "${path%%/*}"
            done | jq -Rnc '[inputs] | unique'
          }
          go_all=$(plugin_names plugins/*/go.mod)
          bats_all=$(plugin_names plugins/*/tests)
          # filter の出力が欠けたときも全ての plugin を回す側に倒す
          if [ "$SHARED" != "false" ] || [ -z "$PLUGIN_FILES" ]; then
            changed=$(jq -nc --argjson go "$go_all" --argjson bats "$bats_all" '$go + $bats | unique')
          else
            changed=$(jq -c '[.[] | split("/")[1]] | unique' <<<"$PLUGIN_FILES")
          fi
          go=$(jq -nc --argjson all "$go_all" --argjson changed "$changed" '$all - ($all - $changed)')
          bats=$(jq -nc --argjson all "$bats_all" --argjson changed "$changed" '$all - ($all - $changed)')
          printf 'go-plugins=%s\nbats-plugins=%s\n' "$go" "$bats" | tee -a "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    env:
      # validate はネットワーク不要なので telemetry などの外向き通信を止める
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.283
      - run: claude plugin validate --strict .
      - run: ./scripts/validate-plugins.sh

  # onboard 済み workflow の lockfile はランナーが実行時に検証する。この job は
  # それより手前のずれ (lockfile に無い uses、使われていない記録) を見る。
  actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: usadamasa/gh-manage/actions/verify-actions-lock@main

  # plugin に同梱した Go の CLI (github-ops の repo-scan、visuals の cleanshot-capture、harness の analyze-tokens) とビルドの script のテスト
  go-test:
    needs:
      - changes
    if: needs.changes.outputs.go-plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.go-plugins) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - run: go -C "plugins/${{ matrix.plugin }}" vet ./...
      - run: go -C "plugins/${{ matrix.plugin }}" test ./...

  # visuals の show-image.sh と toolchain の direnv-env.sh は macOS の /bin/bash (3.2) で動く。
  # bash 4 以降の機能の混入を拾えるよう、macOS の runner で回す
  bats-test:
    needs:
      - changes
    if: needs.changes.outputs.bats-plugins != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.bats-plugins) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # bats 本体は PATH の bash で動く。/bin/bash (3.2) のままだと日本語のテスト名を解決できないので、
      # Homebrew の bash を入れる。テストの対象のスクリプトはテストの中で /bin/bash を明示して動かす。
      # toolchain の direnv-env.bats は本物の direnv を使う
      - run: brew install bash bats-core direnv
      - run: bats "plugins/${{ matrix.plugin }}/tests"

  # Branch Ruleset の required status check にはこのジョブだけを登録する
  ci-status-check:
    needs:
      - actions-lock
      - bats-test
      - changes
      - go-test
      - validate
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
